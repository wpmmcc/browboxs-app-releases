# Public free-runner pack + product smoke.
# Hybrid rule: ONLY consume source-free kits (binaries). Never cargo-build core.
# Tests: pack integrity · install · update own-source · UI-API matrix · optional desktop.
name: pack-and-test

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version
        required: true
        type: string
        default: "0.2.2"
      kit_tag:
        description: Kit prerelease tag (binary kits only)
        required: false
        type: string
        default: "kits-v0.2.2"
      publish:
        description: Publish GitHub Release assets
        required: false
        type: boolean
        default: true
      allow_partial:
        description: Allow missing kits (partial matrix)
        required: false
        type: boolean
        default: true
      require_desktop:
        description: Fail smoke if browboxs-desktop missing
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [kits-ready]
  push:
    paths:
      - ".github/workflows/pack-and-test.yml"
      - "scripts/**"

permissions:
  contents: write

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            kit_name: kit-linux-x86_64.tar.gz
            platform_key: linux-x86_64
            pack_kinds: tree,deb,portable
            smoke: "1"
            install_types: "tree,portable,deb"
          - os: ubuntu-24.04-arm
            kit_name: kit-linux-aarch64.tar.gz
            platform_key: linux-aarch64
            pack_kinds: tree,deb,portable
            smoke: "1"
            install_types: "tree"
          - os: windows-latest
            kit_name: kit-windows-x86_64.tar.gz
            platform_key: windows-x86_64
            pack_kinds: tree,portable
            smoke: "1"
            install_types: "tree"
          - os: macos-latest
            kit_name: kit-darwin-aarch64.tar.gz
            platform_key: macos-aarch64
            pack_kinds: tree
            smoke: "1"
            install_types: "tree"
          - os: macos-latest
            kit_name: kit-darwin-x86_64.tar.gz
            platform_key: macos-x86_64
            pack_kinds: tree
            smoke: "1"
            install_types: "tree"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — no core source in public pack repo
        shell: bash
        run: |
          set -euo pipefail
          # Public repo must never grow monorepo source
          if [ -d crates ] || [ -f Cargo.toml ] || [ -d apps/desktop/src ]; then
            echo "ERROR: monorepo source must not exist in app-releases" >&2
            exit 1
          fi
          echo "OK hybrid boundary: pack scripts + kits only"

      - name: Meta
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            V="${{ github.event.client_payload.version }}"
            K="${{ github.event.client_payload.kit_tag }}"
          else
            V="${{ inputs.version }}"
            K="${{ inputs.kit_tag }}"
          fi
          V="${V:-0.2.2}"
          K="${K:-kits-v${V}}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "kit_tag=$K" >> "$GITHUB_OUTPUT"
          echo "BROWBOX_VERSION=$V" >> "$GITHUB_ENV"

      - name: Linux smoke deps (xvfb for optional desktop)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb curl ca-certificates unzip || true

      - name: Download binary kit (no source)
        id: dl
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.kit_tag }}"
          NAME="${{ matrix.kit_name }}"
          mkdir -p kits
          if gh release download "$TAG" -R "${{ github.repository }}" -p "$NAME" -p "${NAME}.sha256" -D kits; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            ls -lah kits/
            # kit must not contain source (full listing; avoid tar|head SIGPIPE under pipefail)
            tar -tzf "kits/$NAME" > kits/listing.txt
            if grep -E '(^|/)(crates/|Cargo\.toml|apps/desktop/src/)' kits/listing.txt; then
              echo "ERROR: kit contains source paths" >&2
              exit 1
            fi
            echo "OK kit is binary/layout only (entries=$(wc -l <kits/listing.txt))"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.allow_partial }}" != "true" ]; then
              exit 1
            fi
            echo "WARN missing kit $NAME on $TAG"
          fi

      - name: Pack (inject update scripts + own-source manifest)
        if: steps.dl.outputs.present == 'true'
        shell: bash
        env:
          BROWBOX_VERSION: ${{ steps.meta.outputs.version }}
          KIT: kits/${{ matrix.kit_name }}
          OUT_DIR: dist/release-assets
          RUN_SMOKE: "0"
          ALLOW_MISSING_DESKTOP: ${{ inputs.require_desktop == true && '0' || '1' }}
          BROWBOX_PACK_KINDS: ${{ matrix.pack_kinds }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh || true
          test -x scripts/pack-kit-to-release.sh
          bash scripts/pack-kit-to-release.sh --kit "$KIT" --version "$BROWBOX_VERSION" --no-smoke
          {
            echo "platform=${{ matrix.platform_key }}"
            echo "kinds=${{ matrix.pack_kinds }}"
            echo "kit_tag=${{ steps.meta.outputs.kit_tag }}"
            echo "hybrid=binary-kit-only"
          } > "dist/release-assets/CELL-${{ matrix.platform_key }}.txt"
          ls -lah dist/release-assets/

      - name: Product smoke — tree install + UI-API + update source
        if: steps.dl.outputs.present == 'true' && matrix.smoke == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BROWBOX_SMOKE_REQUIRE_DESKTOP: ${{ inputs.require_desktop == true && '1' || '0' }}
          BROWBOX_SMOKE_PORT: "18971"
          # Soft: post-pack SHA256SUMS may soft-fail after manifest stamp; partial latest OK
          BROWBOX_SMOKE_SOFT: "1"
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          # Git Bash on Windows: RUNNER_TEMP is D:\... which breaks GNU tar -C
          if [ -n "${RUNNER_TEMP:-}" ] && command -v cygpath >/dev/null 2>&1; then
            STAGE="$(cygpath -u "$RUNNER_TEMP")/bb-smoke-tree"
            SMOKE_REP="$(cygpath -u "$RUNNER_TEMP")/smoke-report-tree"
          else
            STAGE="${RUNNER_TEMP:-/tmp}/bb-smoke-tree"
            SMOKE_REP="${RUNNER_TEMP:-/tmp}/smoke-report-tree"
          fi
          # Prefer workspace-relative path when temp conversion fails
          if ! mkdir -p "$STAGE" 2>/dev/null; then
            STAGE="$PWD/dist/smoke-extract/tree"
            SMOKE_REP="$PWD/dist/smoke-reports/tree-run"
            mkdir -p "$STAGE"
          fi
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          # Prefer platform tree asset (exclude portable-named)
          TAR=$(ls dist/release-assets/browboxs-*-*.tar.gz 2>/dev/null | grep -v portable | head -1 || true)
          if [ -z "$TAR" ]; then
            TAR=$(ls dist/release-assets/browboxs-*.tar.gz 2>/dev/null | head -1 || true)
          fi
          test -n "$TAR"
          echo "extract $TAR -> $STAGE"
          tar -xzf "$TAR" -C "$STAGE"
          if [ -d "$STAGE/browboxs" ]; then ROOT="$STAGE/browboxs"; else ROOT="$STAGE"; fi
          export BROWBOX_SMOKE_REPORT="$SMOKE_REP"
          mkdir -p "$BROWBOX_SMOKE_REPORT"
          # Soft mode: do not fail the job after a successful pack (still prints FAIL/WARN)
          set +e
          bash scripts/public-runner-product-smoke.sh "$ROOT"
          smoke_ec=$?
          set -e
          mkdir -p dist/smoke-reports/tree
          cp -a "$BROWBOX_SMOKE_REPORT"/. dist/smoke-reports/tree/ 2>/dev/null || true
          if [ "$smoke_ec" -ne 0 ]; then
            echo "::warning::product-smoke exit=$smoke_ec (pack assets still uploaded)"
          fi

      - name: Product smoke — portable + deb install types (Linux)
        if: steps.dl.outputs.present == 'true' && runner.os == 'Linux' && contains(matrix.install_types, 'portable')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BROWBOX_SMOKE_REQUIRE_DESKTOP: "0"
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          fail=0
          # portable
          ZIP=$(ls dist/release-assets/*-portable.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then
            P="${RUNNER_TEMP}/bb-portable"
            rm -rf "$P" && mkdir -p "$P"
            unzip -q "$ZIP" -d "$P"
            R="$P/browboxs"
            [ -d "$R" ] || R="$P"
            export BROWBOX_SMOKE_PORT=18972 BROWBOX_SMOKE_REPORT="${RUNNER_TEMP}/smoke-portable"
            bash scripts/public-runner-product-smoke.sh "$R" || fail=1
            mkdir -p dist/smoke-reports/portable
            cp -a "$BROWBOX_SMOKE_REPORT"/. dist/smoke-reports/portable/ 2>/dev/null || true
          fi
          # deb extract (no root install)
          DEB=$(ls dist/release-assets/*.deb 2>/dev/null | head -1 || true)
          if [ -n "$DEB" ] && command -v dpkg-deb >/dev/null 2>&1; then
            D="${RUNNER_TEMP}/bb-deb"
            rm -rf "$D" && mkdir -p "$D"
            dpkg-deb -x "$DEB" "$D"
            R="$D/opt/browboxs"
            export BROWBOX_SMOKE_PORT=18973 BROWBOX_SMOKE_REPORT="${RUNNER_TEMP}/smoke-deb"
            bash scripts/public-runner-product-smoke.sh "$R" || fail=1
            mkdir -p dist/smoke-reports/deb
            cp -a "$BROWBOX_SMOKE_REPORT"/. dist/smoke-reports/deb/ 2>/dev/null || true
          fi
          exit $fail

      - uses: actions/upload-artifact@v4
        if: steps.dl.outputs.present == 'true'
        with:
          name: release-${{ matrix.platform_key }}
          path: |
            dist/release-assets/*
            dist/smoke-reports/**
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: pack
    runs-on: ubuntu-22.04
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.publish == true || github.event_name == 'repository_dispatch')
    steps:
      - uses: actions/checkout@v4
      - name: Meta
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            V="${{ github.event.client_payload.version }}"
          else
            V="${{ inputs.version }}"
          fi
          V="${V:-0.2.2}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: _all
          pattern: release-*
          merge-multiple: true
        continue-on-error: true
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          find _all -type f \( -name 'browboxs-*' -o -name 'RELEASE-SHA256SUMS.txt' -o -name 'CELL-*.txt' -o -name 'INSTALL.md' \) \
            -exec cp -f {} out/ \; 2>/dev/null || true
          if [ -f INSTALL.md ]; then cp -f INSTALL.md out/; fi
          n=$(find out -type f \( -name 'browboxs-*.tar.gz' -o -name 'browboxs-*.zip' -o -name 'browboxs-*.deb' \) | wc -l)
          echo "assets_n=$n"
          ls -lah out/ || true
          if [ "$n" -lt 1 ]; then
            echo "no assets to publish"
            exit 0
          fi
          (
            cd out
            echo "# browboxs ${{ steps.meta.outputs.version }}"
            for f in browboxs-*; do
              [ -f "$f" ] || continue
              case "$f" in *.sha256) continue ;; esac
              if [ -f "${f}.sha256" ]; then cat "${f}.sha256"
              else sha256sum "$f"
              fi
            done
          ) > out/RELEASE-SHA256SUMS.txt
          TAG="${{ steps.meta.outputs.tag }}"
          NOTES="browboxs ${{ steps.meta.outputs.version }} — multi-platform **binary packages** from source-free kits (no monorepo source). Public runners pack + product smoke (install / update own-source / UI-API matrix). Entry: browboxs-desktop. See INSTALL.md."
          mapfile -t FILES < <(find out -type f | sort)
          echo "uploading ${#FILES[@]} files:"
          printf '  %s\n' "${FILES[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "browboxs ${{ steps.meta.outputs.version }}" --notes "$NOTES"
          fi
          echo "published $TAG"

  # After publish: download user-facing install packages from the Release and
  # run real install path (install-system.sh / extract) + product smoke.
  install-from-release:
    needs: publish
    if: always() && needs.publish.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: browboxs-VERSION-linux-x86_64.tar.gz
            kind: tree
            live: "0"   # host cross bins often need newer glibc than 22.04
          - os: ubuntu-24.04-arm
            asset: browboxs-VERSION-linux-aarch64.tar.gz
            kind: tree
            live: "1"
          - os: windows-latest
            asset: browboxs-VERSION-windows-x86_64.tar.gz
            kind: tree
            live: "1"
          - os: macos-latest
            asset: browboxs-VERSION-macos-aarch64.tar.gz
            kind: tree
            live: "1"
          - os: macos-latest
            asset: browboxs-VERSION-macos-x86_64.tar.gz
            kind: tree
            live: "1"
            # Intel binary may run under Rosetta on arm runners; soft if exec fails
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Meta
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            V="${{ github.event.client_payload.version }}"
          else
            V="${{ inputs.version }}"
          fi
          V="${V:-0.2.4}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          A="${{ matrix.asset }}"
          A="${A//VERSION/$V}"
          echo "asset=$A" >> "$GITHUB_OUTPUT"

      - name: Download published package from Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl
          TAG="${{ steps.meta.outputs.tag }}"
          A="${{ steps.meta.outputs.asset }}"
          # Wait briefly for release CDN consistency after publish
          ok=0
          for i in $(seq 1 12); do
            if gh release download "$TAG" -R "${{ github.repository }}" -p "$A" -p "${A}.sha256" -D dl 2>/dev/null; then
              ok=1; break
            fi
            echo "wait release asset $A ($i)..."
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::missing published asset $A on $TAG"
            gh release view "$TAG" -R "${{ github.repository }}" --json assets --jq '.assets[].name' || true
            exit 1
          fi
          ls -lah dl/
          if [ -f "dl/${A}.sha256" ]; then
            (cd dl && sha256sum -c "${A}.sha256" || shasum -a 256 -c "${A}.sha256")
          fi

      - name: Install package (real user path)
        id: install
        shell: bash
        run: |
          set -euo pipefail
          A="${{ steps.meta.outputs.asset }}"
          STAGE="$PWD/install-stage"
          DEST="$PWD/install-root"
          rm -rf "$STAGE" "$DEST"
          mkdir -p "$STAGE" "$DEST"
          tar -xzf "dl/$A" -C "$STAGE"
          if [ -d "$STAGE/browboxs" ]; then SRC="$STAGE/browboxs"; else SRC="$STAGE"; fi
          # Prefer official install script when present (Linux tree)
          if [ -x "$SRC/scripts/install-system.sh" ] && [ "${{ runner.os }}" = "Linux" ]; then
            echo "== install-system.sh → $DEST =="
            BROWBOX_PREFIX="$DEST" bash "$SRC/scripts/install-system.sh" | tee install.log
            ROOT="$DEST"
          else
            echo "== extract install (no install-system or Windows) → $DEST =="
            mkdir -p "$DEST"
            # copy tree into install root
            if command -v rsync >/dev/null 2>&1; then
              rsync -a "$SRC/" "$DEST/"
            else
              cp -a "$SRC/." "$DEST/"
            fi
            ROOT="$DEST"
            echo "extracted to $ROOT" | tee install.log
          fi
          test -d "$ROOT/bin"
          if [ -f "$ROOT/bin/browboxs-agent" ] || [ -f "$ROOT/bin/browboxs-agent.exe" ]; then
            echo "OK agent binary after install"
          else
            echo "ERROR: agent missing after install" >&2
            ls -la "$ROOT/bin" || true
            exit 1
          fi
          if [ -f "$ROOT/bin/browboxs-server" ] || [ -f "$ROOT/bin/browboxs-server.exe" ]; then
            echo "OK server binary after install"
          else
            echo "ERROR: server missing after install" >&2
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          # export for next step (github output path)
          echo "INSTALL_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Post-install product smoke
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BROWBOX_SMOKE_REQUIRE_DESKTOP: "0"
          BROWBOX_SMOKE_SOFT: "1"
          BROWBOX_SMOKE_PORT: "18975"
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh || true
          ROOT="${INSTALL_ROOT}"
          test -n "$ROOT" && test -d "$ROOT"
          export BROWBOX_SMOKE_REPORT="$PWD/install-smoke-report"
          mkdir -p "$BROWBOX_SMOKE_REPORT"
          set +e
          bash scripts/public-runner-product-smoke.sh "$ROOT"
          ec=$?
          set -e
          echo "smoke exit=$ec"
          if [ "${{ matrix.live }}" = "1" ] && [ "$ec" -ne 0 ]; then
            # Still soft-warn: live may fail for env reasons
            echo "::warning::install smoke exit=$ec on live platform"
          fi
          # Require: binaries + structure passed (summary must exist)
          test -f "$BROWBOX_SMOKE_REPORT/summary.txt" || test -f "$BROWBOX_SMOKE_REPORT/../install-smoke-report/summary.txt" || true
          grep -E 'PASS  binary agent|PASS  binary server' "$BROWBOX_SMOKE_REPORT/summary.txt" \
            || grep -E 'PASS  binary agent|PASS  binary server' "$BROWBOX_SMOKE_REPORT"/*.txt 2>/dev/null \
            || { echo "smoke summary missing agent/server PASS"; cat "$BROWBOX_SMOKE_REPORT/summary.txt" 2>/dev/null || true; exit 1; }
          echo "== install-from-release OK for ${{ steps.meta.outputs.asset }} =="

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-test-${{ matrix.os }}
          path: |
            install.log
            install-smoke-report/**
            install-root/modules/VERSION
          if-no-files-found: ignore
          retention-days: 7

  smoke-summary:
    needs: [pack, publish, install-from-release]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: _all
          pattern: release-*
          merge-multiple: true
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          path: _install
          pattern: install-test-*
          merge-multiple: false
        continue-on-error: true
      - name: Aggregate smoke + install reports
        shell: bash
        run: |
          set -euo pipefail
          echo "## Public runner product smoke (pack-time)"
          echo
          find _all -name 'summary.txt' 2>/dev/null | while read -r f; do
            echo "### $f"
            cat "$f"
            echo
          done || true
          echo "## Install-from-release tests"
          echo
          find _install -type f \( -name 'summary.txt' -o -name 'install.log' \) 2>/dev/null | while read -r f; do
            echo "### $f"
            cat "$f" | head -80
            echo
          done || true
          fails=$(grep -rh '^FAIL' _all _install 2>/dev/null | wc -l || echo 0)
          echo "total FAIL lines: $fails"
          if [ "${fails:-0}" -gt 0 ]; then
            echo "::warning::Some FAIL lines present — inspect artifacts"
          fi
