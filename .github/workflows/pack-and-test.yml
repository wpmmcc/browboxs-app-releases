# Public free-runner MAIN pipeline (S1–S3). Branch: main.
# Hybrid: ONLY source-free kits. Never cargo-build core crates.
# S1 pack → publish v* → S2 install-from-release → S3 UI/function smoke
# SoT: docs/RELEASE-MAIN-PIPELINE.md
name: pack-and-test

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version
        required: true
        type: string
        default: "0.2.4"
      kit_tag:
        description: Kit prerelease tag (binary kits only)
        required: false
        type: string
        default: "kits-v0.2.4"
      publish:
        description: Publish GitHub Release assets
        required: false
        type: boolean
        default: true
      allow_partial:
        description: Allow missing kits (partial matrix)
        required: false
        type: boolean
        default: true
      require_desktop:
        description: Fail smoke if browboxs-desktop missing
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [kits-ready]
  push:
    paths:
      - ".github/workflows/pack-and-test.yml"
      - "scripts/**"

permissions:
  contents: write

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            kit_name: kit-linux-x86_64.tar.gz
            platform_key: linux-x86_64
            pack_kinds: tree,deb,portable
            smoke: "1"
            install_types: "tree,portable,deb"
          - os: ubuntu-24.04-arm
            kit_name: kit-linux-aarch64.tar.gz
            platform_key: linux-aarch64
            pack_kinds: tree,deb,portable
            smoke: "1"
            install_types: "tree,portable,deb"
          - os: windows-latest
            kit_name: kit-windows-x86_64.tar.gz
            platform_key: windows-x86_64
            pack_kinds: tree,portable
            smoke: "1"
            install_types: "tree"
          - os: macos-latest
            kit_name: kit-darwin-aarch64.tar.gz
            platform_key: macos-aarch64
            pack_kinds: tree
            smoke: "1"
            install_types: "tree"
          - os: macos-latest
            kit_name: kit-darwin-x86_64.tar.gz
            platform_key: macos-x86_64
            pack_kinds: tree
            smoke: "1"
            install_types: "tree"
          # P2: Windows 11 ARM hosted runners (native aarch64-msvc kit)
          - os: windows-11-arm
            kit_name: kit-windows-aarch64.tar.gz
            platform_key: windows-aarch64
            pack_kinds: tree,portable
            smoke: "1"
            install_types: "tree"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — no core source in public pack repo
        shell: bash
        run: |
          set -euo pipefail
          # Public repo must never grow monorepo source
          if [ -d crates ] || [ -f Cargo.toml ] || [ -d apps/desktop/src ]; then
            echo "ERROR: monorepo source must not exist in app-releases" >&2
            exit 1
          fi
          echo "OK hybrid boundary: pack scripts + kits only"

      - name: Meta
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            V="${{ github.event.client_payload.version }}"
            K="${{ github.event.client_payload.kit_tag }}"
          else
            V="${{ inputs.version }}"
            K="${{ inputs.kit_tag }}"
          fi
          V="${V:-0.2.2}"
          K="${K:-kits-v${V}}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "kit_tag=$K" >> "$GITHUB_OUTPUT"
          echo "BROWBOX_VERSION=$V" >> "$GITHUB_ENV"

      - name: Linux deps (Tauri build + xvfb + WebKit)
        if: runner.os == 'Linux'
        env:
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          NO_PROXY: ${{ secrets.NO_PROXY }}
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if [ -n "${HTTP_PROXY:-}" ] || [ -n "${HTTPS_PROXY:-}" ]; then
            {
              [ -n "${HTTP_PROXY:-}" ] && echo "Acquire::http::Proxy \"${HTTP_PROXY}\";"
              [ -n "${HTTPS_PROXY:-}" ] && echo "Acquire::https::Proxy \"${HTTPS_PROXY}\";"
            } | sudo tee /etc/apt/apt.conf.d/99ci-proxy >/dev/null
            echo "apt proxy configured from repo secrets"
          fi
          sudo timeout 180 apt-get update -qq \
            -o Acquire::Retries=5 -o Acquire::http::Timeout=60 \
            || sudo timeout 180 apt-get update -o Acquire::Retries=5
          sudo timeout 600 apt-get install -y -qq \
            -o DPkg::Lock::Timeout=120 \
            xvfb curl ca-certificates unzip python3 \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev \
            libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-shell/src-tauri
          prefix-key: desktop-shell-${{ matrix.platform_key }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download binary kit (no source)
        id: dl
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.kit_tag }}"
          NAME="${{ matrix.kit_name }}"
          mkdir -p kits
          if gh release download "$TAG" -R "${{ github.repository }}" -p "$NAME" -p "${NAME}.sha256" -D kits; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            ls -lah kits/
            # kit must not contain source (full listing; avoid tar|head SIGPIPE under pipefail)
            tar -tzf "kits/$NAME" > kits/listing.txt
            if grep -E '(^|/)(crates/|Cargo\.toml|apps/desktop/src/)' kits/listing.txt; then
              echo "ERROR: kit contains source paths" >&2
              exit 1
            fi
            echo "OK kit is binary/layout only (entries=$(wc -l <kits/listing.txt))"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.allow_partial }}" != "true" ]; then
              exit 1
            fi
            echo "WARN missing kit $NAME on $TAG"
          fi

      - name: Pack (inject update scripts + own-source manifest)
        if: steps.dl.outputs.present == 'true'
        shell: bash
        env:
          BROWBOX_VERSION: ${{ steps.meta.outputs.version }}
          KIT: kits/${{ matrix.kit_name }}
          OUT_DIR: dist/release-assets
          RUN_SMOKE: "0"
          BUILD_DESKTOP: "1"
          BROWBOX_DESKTOP_WDIO: "1"
          ALLOW_MISSING_DESKTOP: "0"
          BROWBOX_PACK_KINDS: ${{ matrix.pack_kinds }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh || true
          test -x scripts/pack-kit-to-release.sh
          bash scripts/pack-kit-to-release.sh --kit "$KIT" --version "$BROWBOX_VERSION" --no-smoke
          {
            echo "platform=${{ matrix.platform_key }}"
            echo "kinds=${{ matrix.pack_kinds }}"
            echo "kit_tag=${{ steps.meta.outputs.kit_tag }}"
            echo "hybrid=kit-agent-server+runner-desktop"
          } > "dist/release-assets/CELL-${{ matrix.platform_key }}.txt"
          ls -lah dist/release-assets/

      - name: Product smoke — tree install + UI-API + update source
        if: steps.dl.outputs.present == 'true' && matrix.smoke == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BROWBOX_SMOKE_REQUIRE_DESKTOP: "1"
          BROWBOX_SMOKE_PORT: "18971"
          # Soft: post-pack SHA256SUMS may soft-fail after manifest stamp; partial latest OK
          BROWBOX_SMOKE_SOFT: "1"
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          # Git Bash on Windows: RUNNER_TEMP is D:\... which breaks GNU tar -C
          if [ -n "${RUNNER_TEMP:-}" ] && command -v cygpath >/dev/null 2>&1; then
            STAGE="$(cygpath -u "$RUNNER_TEMP")/bb-smoke-tree"
            SMOKE_REP="$(cygpath -u "$RUNNER_TEMP")/smoke-report-tree"
          else
            STAGE="${RUNNER_TEMP:-/tmp}/bb-smoke-tree"
            SMOKE_REP="${RUNNER_TEMP:-/tmp}/smoke-report-tree"
          fi
          # Prefer workspace-relative path when temp conversion fails
          if ! mkdir -p "$STAGE" 2>/dev/null; then
            STAGE="$PWD/dist/smoke-extract/tree"
            SMOKE_REP="$PWD/dist/smoke-reports/tree-run"
            mkdir -p "$STAGE"
          fi
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          # Prefer platform tree asset (exclude portable-named)
          TAR=$(ls dist/release-assets/browboxs-*-*.tar.gz 2>/dev/null | grep -v portable | head -1 || true)
          if [ -z "$TAR" ]; then
            TAR=$(ls dist/release-assets/browboxs-*.tar.gz 2>/dev/null | head -1 || true)
          fi
          test -n "$TAR"
          echo "extract $TAR -> $STAGE"
          tar -xzf "$TAR" -C "$STAGE"
          if [ -d "$STAGE/browboxs" ]; then ROOT="$STAGE/browboxs"; else ROOT="$STAGE"; fi
          export BROWBOX_SMOKE_REPORT="$SMOKE_REP"
          mkdir -p "$BROWBOX_SMOKE_REPORT"
          # Soft mode: do not fail the job after a successful pack (still prints FAIL/WARN)
          set +e
          bash scripts/public-runner-product-smoke.sh "$ROOT"
          smoke_ec=$?
          set -e
          mkdir -p dist/smoke-reports/tree
          cp -a "$BROWBOX_SMOKE_REPORT"/. dist/smoke-reports/tree/ 2>/dev/null || true
          if [ "$smoke_ec" -ne 0 ]; then
            echo "::warning::product-smoke exit=$smoke_ec (pack assets still uploaded)"
          fi

      - name: Product smoke — portable + deb install types (Linux)
        if: steps.dl.outputs.present == 'true' && runner.os == 'Linux' && contains(matrix.install_types, 'portable')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BROWBOX_SMOKE_REQUIRE_DESKTOP: "0"
          # Soft: pack already succeeded; unauth 200 / partial update must not red the cell
          BROWBOX_SMOKE_SOFT: "1"
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          # portable
          ZIP=$(ls dist/release-assets/*-portable.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then
            P="${RUNNER_TEMP}/bb-portable"
            rm -rf "$P" && mkdir -p "$P"
            unzip -q "$ZIP" -d "$P"
            R="$P/browboxs"
            [ -d "$R" ] || R="$P"
            export BROWBOX_SMOKE_PORT=18972 BROWBOX_SMOKE_REPORT="${RUNNER_TEMP}/smoke-portable"
            set +e
            bash scripts/public-runner-product-smoke.sh "$R"
            pec=$?
            set -e
            mkdir -p dist/smoke-reports/portable
            cp -a "$BROWBOX_SMOKE_REPORT"/. dist/smoke-reports/portable/ 2>/dev/null || true
            if [ "$pec" -ne 0 ]; then
              echo "::warning::portable product-smoke exit=$pec (assets still uploaded)"
            fi
          fi
          # deb extract (no root install)
          DEB=$(ls dist/release-assets/*.deb 2>/dev/null | head -1 || true)
          if [ -n "$DEB" ] && command -v dpkg-deb >/dev/null 2>&1; then
            D="${RUNNER_TEMP}/bb-deb"
            rm -rf "$D" && mkdir -p "$D"
            dpkg-deb -x "$DEB" "$D"
            R="$D/opt/browboxs"
            export BROWBOX_SMOKE_PORT=18973 BROWBOX_SMOKE_REPORT="${RUNNER_TEMP}/smoke-deb"
            set +e
            bash scripts/public-runner-product-smoke.sh "$R"
            pec=$?
            set -e
            mkdir -p dist/smoke-reports/deb
            cp -a "$BROWBOX_SMOKE_REPORT"/. dist/smoke-reports/deb/ 2>/dev/null || true
            if [ "$pec" -ne 0 ]; then
              echo "::warning::deb product-smoke exit=$pec (assets still uploaded)"
            fi
          fi

      - uses: actions/upload-artifact@v4
        if: steps.dl.outputs.present == 'true'
        with:
          name: release-${{ matrix.platform_key }}
          path: |
            dist/release-assets/*
            dist/smoke-reports/**
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: pack
    runs-on: ubuntu-22.04
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.publish == true || github.event_name == 'repository_dispatch')
    steps:
      - uses: actions/checkout@v4
      - name: Meta
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            V="${{ github.event.client_payload.version }}"
          else
            V="${{ inputs.version }}"
          fi
          V="${V:-0.2.2}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: _all
          pattern: release-*
          merge-multiple: true
        continue-on-error: true
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          find _all -type f \( -name 'browboxs-*' -o -name 'RELEASE-SHA256SUMS.txt' -o -name 'CELL-*.txt' -o -name 'INSTALL.md' \) \
            -exec cp -f {} out/ \; 2>/dev/null || true
          if [ -f INSTALL.md ]; then cp -f INSTALL.md out/; fi
          n=$(find out -type f \( -name 'browboxs-*.tar.gz' -o -name 'browboxs-*.zip' -o -name 'browboxs-*.deb' \) | wc -l)
          echo "assets_n=$n"
          ls -lah out/ || true
          if [ "$n" -lt 1 ]; then
            echo "no assets to publish"
            exit 0
          fi
          # ── Primary install packages: exactly 6 (linux/macos/windows × x86_64/aarch64) ──
          V="${{ steps.meta.outputs.version }}"
          PRIMARY=(
            "browboxs-${V}-linux-x86_64.tar.gz"
            "browboxs-${V}-linux-aarch64.tar.gz"
            "browboxs-${V}-macos-x86_64.tar.gz"
            "browboxs-${V}-macos-aarch64.tar.gz"
            "browboxs-${V}-windows-x86_64.tar.gz"
            "browboxs-${V}-windows-aarch64.tar.gz"
          )
          KIT_MAP=(
            "kit-linux-x86_64.tar.gz"
            "kit-linux-aarch64.tar.gz"
            "kit-darwin-x86_64.tar.gz"
            "kit-darwin-aarch64.tar.gz"
            "kit-windows-x86_64.tar.gz"
            "kit-windows-aarch64.tar.gz"
          )
          {
            echo "# browboxs ${V} — primary install packages (6 cells)"
            echo "# os/arch tree tar.gz — one per kit from host-cross-kits"
            echo "# kit → user asset:"
            for i in "${!PRIMARY[@]}"; do
              echo "#   ${KIT_MAP[$i]} → ${PRIMARY[$i]}"
            done
            echo
          } > out/RELEASE-PRIMARY-6.txt
          miss=0
          for i in "${!PRIMARY[@]}"; do
            f="${PRIMARY[$i]}"
            if [ -f "out/$f" ]; then
              echo "OK primary $f"
              echo "$f" >> out/RELEASE-PRIMARY-6.txt
            else
              echo "::error::missing primary install package: $f (need kit ${KIT_MAP[$i]})"
              miss=$((miss + 1))
            fi
          done
          if [ "$miss" -gt 0 ]; then
            echo "::error::RELEASE requires all 6 primary tree packages (linux/macos/windows × arm/x86)"
            ls -la out/browboxs-*.tar.gz 2>/dev/null || true
            exit 1
          fi
          echo "primary_6=OK"
          (
            cd out
            echo "# browboxs ${V} — PRIMARY (6 install packages)"
            for f in "${PRIMARY[@]}"; do
              if [ -f "${f}.sha256" ]; then cat "${f}.sha256"
              elif [ -f "$f" ]; then sha256sum "$f"
              fi
            done
            echo
            echo "# OPTIONAL (deb/portable/extra formats — same 6 cells)"
            for f in browboxs-*; do
              [ -f "$f" ] || continue
              case "$f" in *.sha256) continue ;; esac
              case "$f" in
                browboxs-${V}-linux-x86_64.tar.gz|\
                browboxs-${V}-linux-aarch64.tar.gz|\
                browboxs-${V}-macos-x86_64.tar.gz|\
                browboxs-${V}-macos-aarch64.tar.gz|\
                browboxs-${V}-windows-x86_64.tar.gz|\
                browboxs-${V}-windows-aarch64.tar.gz) continue ;;
              esac
              case "$f" in *.tar.gz|*.zip|*.deb)
                if [ -f "${f}.sha256" ]; then cat "${f}.sha256"
                else sha256sum "$f"
                fi
                ;;
              esac
            done
          ) > out/RELEASE-SHA256SUMS.txt
          TAG="${{ steps.meta.outputs.tag }}"
          NOTES="browboxs ${V} — 6 primary install packages (tree tar.gz): linux-x86_64, linux-aarch64, macos-x86_64, macos-aarch64, windows-x86_64, windows-aarch64. Kits: kits-v${V} (6 cells). See RELEASE-PRIMARY-6.txt and INSTALL.md. Entry: browboxs-desktop."
          mapfile -t FILES < <(find out -type f | sort)
          echo "uploading ${#FILES[@]} files:"
          printf '  %s\n' "${FILES[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "browboxs ${{ steps.meta.outputs.version }}" --notes "$NOTES"
          fi
          echo "published $TAG"

  # After publish: download user-facing install packages from the Release and
  # run real install path (install-system.sh / extract) + product smoke.
  install-from-release:
    needs: publish
    if: always() && needs.publish.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          # live=1: expect agent runnable. linux-x86_64 pack+install both use
          # ubuntu-24.04 (22.04 apt mirrors were timing out on hosted runners).
          - os: ubuntu-24.04
            asset: browboxs-VERSION-linux-x86_64.tar.gz
            kind: tree
            live: "1"
            ui_e2e: "1"
          - os: ubuntu-24.04-arm
            asset: browboxs-VERSION-linux-aarch64.tar.gz
            kind: tree
            live: "1"
            ui_e2e: "1"
          - os: windows-latest
            asset: browboxs-VERSION-windows-x86_64.tar.gz
            kind: tree
            live: "1"
            ui_e2e: "1"
          - os: macos-latest
            asset: browboxs-VERSION-macos-aarch64.tar.gz
            kind: tree
            live: "1"
            ui_e2e: "1"
          - os: macos-latest
            asset: browboxs-VERSION-macos-x86_64.tar.gz
            kind: tree
            live: "1"
            ui_e2e: "1"
            # Intel binary may run under Rosetta on arm runners; soft if exec fails
          - os: windows-11-arm
            asset: browboxs-VERSION-windows-aarch64.tar.gz
            kind: tree
            live: "1"
            ui_e2e: "1"
            optional: "1"   # soft-skip until kit-windows-aarch64 published
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: matrix.ui_e2e == '1'
        with:
          node-version: "22"
      - name: Linux install-test deps (xvfb + WebKit for Tauri UI)
        if: runner.os == 'Linux'
        env:
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          NO_PROXY: ${{ secrets.NO_PROXY }}
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if [ -n "${HTTP_PROXY:-}" ] || [ -n "${HTTPS_PROXY:-}" ]; then
            {
              [ -n "${HTTP_PROXY:-}" ] && echo "Acquire::http::Proxy \"${HTTP_PROXY}\";"
              [ -n "${HTTPS_PROXY:-}" ] && echo "Acquire::https::Proxy \"${HTTPS_PROXY}\";"
            } | sudo tee /etc/apt/apt.conf.d/99ci-proxy >/dev/null
          fi
          sudo timeout 180 apt-get update -qq \
            -o Acquire::Retries=5 -o Acquire::http::Timeout=60 \
            || sudo timeout 180 apt-get update -o Acquire::Retries=5
          sudo timeout 300 apt-get install -y -qq \
            -o DPkg::Lock::Timeout=120 \
            xvfb curl ca-certificates python3 x11-utils \
            libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1
          sudo timeout 180 apt-get install -y -qq webkit2gtk-driver || true

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'macOS'

      - uses: actions/cache@v4
        if: runner.os != 'macOS'
        with:
          path: |
            ~/.cargo/bin/tauri-driver
            ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install tauri-driver
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          if command -v tauri-driver >/dev/null 2>&1; then
            echo "tauri-driver already present: $(command -v tauri-driver)"
          else
            cargo install tauri-driver --locked || cargo install tauri-driver
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install msedgedriver (Windows WebView)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $edge = @(
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { Write-Host "::warning::msedge.exe not found"; exit 0 }
          $ver = (Get-Item $edge).VersionInfo.ProductVersion
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { "arm64" } else { "win64" }
          $zip = "edgedriver_$arch.zip"
          $urls = @(
            "https://msedgedriver.azureedge.net/$ver/$zip",
            "https://msedgedriver.microsoft.com/$ver/$zip"
          )
          $ok = $false
          foreach ($u in $urls) {
            try {
              Write-Host "download $u"
              Invoke-WebRequest -Uri $u -OutFile $zip -UseBasicParsing
              $ok = $true
              break
            } catch {
              Write-Host "miss $u"
            }
          }
          if (-not $ok) { Write-Host "::warning::msedgedriver download failed"; exit 0 }
          Expand-Archive -Force $zip -DestinationPath "$pwd/msedgedriver"
          "$pwd/msedgedriver" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Get-ChildItem "$pwd/msedgedriver"
      - name: Meta
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            V="${{ github.event.client_payload.version }}"
          else
            V="${{ inputs.version }}"
          fi
          V="${V:-0.2.4}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          A="${{ matrix.asset }}"
          A="${A//VERSION/$V}"
          echo "asset=$A" >> "$GITHUB_OUTPUT"
          echo "optional=${{ matrix.optional || '0' }}" >> "$GITHUB_OUTPUT"

      - name: Download published package from Release
        id: dl_pkg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl
          TAG="${{ steps.meta.outputs.tag }}"
          A="${{ steps.meta.outputs.asset }}"
          # Wait briefly for release CDN consistency after publish
          ok=0
          for i in $(seq 1 12); do
            if gh release download "$TAG" -R "${{ github.repository }}" -p "$A" -p "${A}.sha256" -D dl 2>/dev/null; then
              ok=1; break
            fi
            echo "wait release asset $A ($i)..."
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            if [ "${{ steps.meta.outputs.optional }}" = "1" ]; then
              echo "::warning::optional asset $A missing on $TAG — skip install cell"
              echo "present=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::missing published asset $A on $TAG"
            gh release view "$TAG" -R "${{ github.repository }}" --json assets --jq '.assets[].name' || true
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          ls -lah dl/
          if [ -f "dl/${A}.sha256" ]; then
            (cd dl && sha256sum -c "${A}.sha256" || shasum -a 256 -c "${A}.sha256")
          fi

      - name: Install package (real user path)
        id: install
        if: steps.dl_pkg.outputs.present != 'false'
        shell: bash
        run: |
          set -euo pipefail
          A="${{ steps.meta.outputs.asset }}"
          STAGE="$PWD/install-stage"
          DEST="$PWD/install-root"
          rm -rf "$STAGE" "$DEST"
          mkdir -p "$STAGE" "$DEST"
          tar -xzf "dl/$A" -C "$STAGE"
          if [ -d "$STAGE/browboxs" ]; then SRC="$STAGE/browboxs"; else SRC="$STAGE"; fi
          # Prefer official install script when present (Linux tree)
          if [ -x "$SRC/scripts/install-system.sh" ] && [ "${{ runner.os }}" = "Linux" ]; then
            echo "== install-system.sh → $DEST =="
            BROWBOX_PREFIX="$DEST" bash "$SRC/scripts/install-system.sh" | tee install.log
            ROOT="$DEST"
          else
            echo "== extract install (no install-system or Windows) → $DEST =="
            mkdir -p "$DEST"
            # copy tree into install root
            if command -v rsync >/dev/null 2>&1; then
              rsync -a "$SRC/" "$DEST/"
            else
              cp -a "$SRC/." "$DEST/"
            fi
            ROOT="$DEST"
            echo "extracted to $ROOT" | tee install.log
          fi
          test -d "$ROOT/bin"
          if [ -f "$ROOT/bin/browboxs-agent" ] || [ -f "$ROOT/bin/browboxs-agent.exe" ]; then
            echo "OK agent binary after install"
          else
            echo "ERROR: agent missing after install" >&2
            ls -la "$ROOT/bin" || true
            exit 1
          fi
          if [ -f "$ROOT/bin/browboxs-server" ] || [ -f "$ROOT/bin/browboxs-server.exe" ]; then
            echo "OK server binary after install"
          else
            echo "ERROR: server missing after install" >&2
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          # export for next step (github output path)
          echo "INSTALL_ROOT=$ROOT" >> "$GITHUB_ENV"

      # S3: post-install UI/function (API matrix = workbench panels; optional desktop)
      - name: S3 Post-install UI/function smoke
        if: steps.dl_pkg.outputs.present != 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BROWBOX_SMOKE_REQUIRE_DESKTOP: "1"
          BROWBOX_SMOKE_SOFT: "1"
          BROWBOX_SMOKE_PORT: "18975"
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh || true
          ROOT="${INSTALL_ROOT}"
          test -n "$ROOT" && test -d "$ROOT"
          export BROWBOX_SMOKE_REPORT="$PWD/install-smoke-report"
          mkdir -p "$BROWBOX_SMOKE_REPORT"
          set +e
          if [ -f scripts/public-runner-ui-function-smoke.sh ]; then
            bash scripts/public-runner-ui-function-smoke.sh "$ROOT"
          else
            bash scripts/public-runner-product-smoke.sh "$ROOT"
          fi
          ec=$?
          set -e
          echo "S3 ui-function smoke exit=$ec"
          if [ "${{ matrix.live }}" = "1" ] && [ "$ec" -ne 0 ]; then
            echo "::warning::S3 install UI/function exit=$ec on live platform"
          fi
          # Hard gate: agent + server present in package after install
          test -f "$BROWBOX_SMOKE_REPORT/summary.txt" || true
          grep -E 'PASS  binary agent|PASS  binary server' "$BROWBOX_SMOKE_REPORT/summary.txt" \
            || grep -E 'PASS  binary agent|PASS  binary server' "$BROWBOX_SMOKE_REPORT"/*.txt 2>/dev/null \
            || { echo "smoke summary missing agent/server PASS"; cat "$BROWBOX_SMOKE_REPORT/summary.txt" 2>/dev/null || true; exit 1; }
          # Soft prefer: at least one UI-API PASS when live agent ran
          if grep -q 'PASS  UI-API' "$BROWBOX_SMOKE_REPORT/summary.txt" 2>/dev/null; then
            echo "S3 UI-API matrix has PASS lines"
          else
            echo "::notice::S3 no UI-API PASS (agent may be non-runnable / soft path)"
          fi
          echo "== S3 API/function smoke OK for ${{ steps.meta.outputs.asset }} =="

      # S3b: full workbench WebView e2e (tauri-driver Linux/Win; embedded WDIO on macOS).
      - name: S3b Tauri WebView e2e (installed desktop)
        if: steps.dl_pkg.outputs.present != 'false' && matrix.ui_e2e == '1'
        shell: bash
        env:
          BROWBOX_TAURI_E2E_STRICT: ${{ (runner.os == 'Linux' || contains(matrix.asset, 'macos-aarch64')) && '1' || '0' }}
          BROWBOX_E2E_DRIVER: ${{ (runner.os == 'Linux' || runner.os == 'macOS') && 'embedded' || '' }}
          BROWBOX_AGENT_PORT: "18985"
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh scripts/e2e-tauri/* 2>/dev/null || true
          ROOT="${INSTALL_ROOT}"
          test -n "$ROOT" && test -d "$ROOT"
          export BROWBOX_TAURI_E2E_REPORT="$PWD/install-tauri-e2e-report"
          mkdir -p "$BROWBOX_TAURI_E2E_REPORT"
          export PATH="$HOME/.cargo/bin:$PATH"
          if [ ! -f scripts/public-runner-tauri-ui-e2e.sh ]; then
            echo "::error::missing public-runner-tauri-ui-e2e.sh"
            exit 1
          fi
          set +e
          bash scripts/public-runner-tauri-ui-e2e.sh "$ROOT"
          ec=$?
          set -e
          echo "S3b tauri WebView e2e exit=$ec"
          if [ "$ec" -ne 0 ]; then
            if [ "${{ runner.os }}" = "Linux" ] || [[ "${{ steps.meta.outputs.asset }}" == *macos-aarch64* ]]; then
              echo "::error::S3b Tauri WebView e2e FAILED on ${{ runner.os }} — see install-tauri-e2e-report"
              cat "$BROWBOX_TAURI_E2E_REPORT/summary.txt" 2>/dev/null || true
              exit 1
            fi
            echo "::warning::S3b Tauri WebView e2e exit=$ec on ${{ runner.os }} (non-strict)"
          fi
          echo "== S3b tauri WebView e2e done for ${{ steps.meta.outputs.asset }} =="

      # S3c: Playwright + static ui/desktop — lab only, not the product UI gate.
      - name: S3c Playwright static UI lab (non-product)
        if: steps.dl_pkg.outputs.present != 'false' && matrix.ui_e2e == '1' && runner.os != 'Linux'
        shell: bash
        env:
          BROWBOX_SMOKE_SOFT: "1"
          BROWBOX_UI_E2E_STRICT: "0"
          BROWBOX_UI_E2E_REQUIRE_DESKTOP: "1"
          BROWBOX_UI_E2E_PORT_AGENT: "18976"
          BROWBOX_UI_E2E_PORT_UI: "18980"
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh scripts/ui-e2e/* 2>/dev/null || true
          ROOT="${INSTALL_ROOT}"
          test -n "$ROOT" && test -d "$ROOT"
          export BROWBOX_UI_E2E_REPORT="$PWD/install-ui-e2e-report"
          mkdir -p "$BROWBOX_UI_E2E_REPORT"
          if [ ! -f scripts/public-runner-desktop-ui-e2e.sh ]; then
            echo "::notice::no Playwright lab script — skip S3c"
            exit 0
          fi
          set +e
          bash scripts/public-runner-desktop-ui-e2e.sh "$ROOT"
          ec=$?
          set -e
          echo "S3c Playwright lab exit=$ec (non-strict)"
          echo "== install-from-release + S3/S3b OK for ${{ steps.meta.outputs.asset }} =="

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Unique per matrix cell (two macos-* share matrix.os)
          name: install-test-${{ matrix.asset }}
          path: |
            install.log
            install-smoke-report/**
            install-ui-e2e-report/**
            install-tauri-e2e-report/**
            install-root/modules/VERSION
          if-no-files-found: ignore
          retention-days: 7

  smoke-summary:
    needs: [pack, publish, install-from-release]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: _all
          pattern: release-*
          merge-multiple: true
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          path: _install
          pattern: install-test-*
          merge-multiple: false
        continue-on-error: true
      - name: Aggregate smoke + install reports
        shell: bash
        run: |
          set -euo pipefail
          echo "## Public runner product smoke (pack-time)"
          echo
          find _all -name 'summary.txt' 2>/dev/null | while read -r f; do
            echo "### $f"
            cat "$f"
            echo
          done || true
          echo "## Install-from-release tests"
          echo
          find _install -type f \( -name 'summary.txt' -o -name 'install.log' \) 2>/dev/null | while read -r f; do
            echo "### $f"
            cat "$f" | head -80
            echo
          done || true
          fails=$(grep -rh '^FAIL' _all _install 2>/dev/null | wc -l || echo 0)
          echo "total FAIL lines: $fails"
          if [ "${fails:-0}" -gt 0 ]; then
            echo "::warning::Some FAIL lines present — inspect artifacts"
          fi
