# Public free-runner pack — one OS×arch cell per job. No cargo core builds.
name: pack-and-test

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version
        required: true
        type: string
        default: "0.1.0"
      kit_tag:
        description: Kit prerelease tag
        required: false
        type: string
        default: "kits-v0.1.0"
      publish:
        description: Publish GitHub Release
        required: false
        type: boolean
        default: true
      allow_partial:
        description: Allow missing kits
        required: false
        type: boolean
        default: true
  repository_dispatch:
    types: [kits-ready]
  push:
    paths:
      - ".github/workflows/pack-and-test.yml"
      - "scripts/**"

permissions:
  contents: write

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            kit_name: kit-linux-x86_64.tar.gz
            platform_key: linux-x86_64
            pack_kinds: tree,deb,portable
            smoke: "1"
          - os: ubuntu-24.04-arm
            kit_name: kit-linux-aarch64.tar.gz
            platform_key: linux-aarch64
            pack_kinds: tree,deb,portable
            smoke: "1"
          - os: windows-latest
            kit_name: kit-windows-x86_64.tar.gz
            platform_key: windows-x86_64
            pack_kinds: tree,portable
            smoke: "0"
          - os: macos-latest
            kit_name: kit-darwin-aarch64.tar.gz
            platform_key: macos-aarch64
            pack_kinds: tree
            smoke: "1"
          - os: macos-latest
            kit_name: kit-darwin-x86_64.tar.gz
            platform_key: macos-x86_64
            pack_kinds: tree
            smoke: "0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Meta
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            V="${{ github.event.client_payload.version }}"
            K="${{ github.event.client_payload.kit_tag }}"
          else
            V="${{ inputs.version }}"
            K="${{ inputs.kit_tag }}"
          fi
          V="${V:-0.1.0}"
          K="${K:-kits-v${V}}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "kit_tag=$K" >> "$GITHUB_OUTPUT"
          echo "BROWBOX_VERSION=$V" >> "$GITHUB_ENV"

      - name: Download kit
        id: dl
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.kit_tag }}"
          NAME="${{ matrix.kit_name }}"
          mkdir -p kits
          if gh release download "$TAG" -p "$NAME" -p "${NAME}.sha256" -D kits; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            ls -lah kits/
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.allow_partial }}" != "true" ]; then
              exit 1
            fi
            echo "WARN missing kit $NAME"
          fi

      - name: Pack
        if: steps.dl.outputs.present == 'true'
        shell: bash
        env:
          BROWBOX_VERSION: ${{ steps.meta.outputs.version }}
          KIT: kits/${{ matrix.kit_name }}
          OUT_DIR: dist/release-assets
          RUN_SMOKE: ${{ matrix.smoke }}
          ALLOW_MISSING_DESKTOP: "1"
          BROWBOX_PACK_KINDS: ${{ matrix.pack_kinds }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh || true
          test -x scripts/pack-kit-to-release.sh
          bash scripts/pack-kit-to-release.sh --kit "$KIT" --version "$BROWBOX_VERSION"
          echo "platform=${{ matrix.platform_key }}" > "dist/release-assets/CELL-${{ matrix.platform_key }}.txt"
          echo "kinds=${{ matrix.pack_kinds }}" >> "dist/release-assets/CELL-${{ matrix.platform_key }}.txt"
          ls -lah dist/release-assets/

      - uses: actions/upload-artifact@v4
        if: steps.dl.outputs.present == 'true'
        with:
          name: release-${{ matrix.platform_key }}
          path: dist/release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: pack
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Meta
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            V="${{ github.event.client_payload.version }}"
          else
            V="${{ inputs.version }}"
          fi
          V="${V:-0.1.0}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: _all
          pattern: release-*
          merge-multiple: true
        continue-on-error: true
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          find _all -type f \( -name 'browboxs-*' -o -name 'RELEASE-SHA256SUMS.txt' -o -name 'CELL-*.txt' -o -name 'INSTALL.md' \) \
            -exec cp -f {} out/ \; 2>/dev/null || true
          if [ -f INSTALL.md ]; then cp -f INSTALL.md out/; fi
          n=$(find out -type f \( -name 'browboxs-*.tar.gz' -o -name 'browboxs-*.zip' -o -name 'browboxs-*.deb' \) | wc -l)
          echo "assets_n=$n"
          ls -lah out/ || true
          if [ "$n" -lt 1 ]; then
            echo "no assets to publish"
            exit 0
          fi
          (
            cd out
            echo "# browboxs ${{ steps.meta.outputs.version }}"
            for f in browboxs-*; do
              [ -f "$f" ] || continue
              case "$f" in *.sha256) continue ;; esac
              if [ -f "${f}.sha256" ]; then cat "${f}.sha256"
              else sha256sum "$f"
              fi
            done
          ) > out/RELEASE-SHA256SUMS.txt
          TAG="${{ steps.meta.outputs.tag }}"
          NOTES="browboxs ${{ steps.meta.outputs.version }} multi-platform packages (from source-free kits). See INSTALL.md. Entry: browboxs-desktop."
          mapfile -t FILES < <(find out -type f | sort)
          echo "uploading ${#FILES[@]} files:"
          printf '  %s\n' "${FILES[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "browboxs ${{ steps.meta.outputs.version }}" --notes "$NOTES"
          fi
          echo "published $TAG"
